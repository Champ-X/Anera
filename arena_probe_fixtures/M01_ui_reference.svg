<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Anera operations dashboard reference</title>
  <desc id="desc">A dark navy sidebar and a pale dashboard containing metric cards, a bar chart, and a recent runs table.</desc>
  <rect width="1200" height="800" fill="#f4f1ea"/>
  <rect width="228" height="800" fill="#172235"/>
  <circle cx="42" cy="42" r="15" fill="#ff6b45"/>
  <text x="69" y="49" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">ANERA OPS</text>
  <g font-family="Arial, sans-serif" font-size="16" fill="#aeb9c9">
    <text x="32" y="120" fill="#ffffff" font-weight="700">Overview</text>
    <text x="32" y="166">Runs</text>
    <text x="32" y="212">Artifacts</text>
    <text x="32" y="258">Evaluations</text>
    <text x="32" y="304">Settings</text>
  </g>
  <rect x="20" y="88" width="188" height="50" rx="10" fill="#263750"/>
  <text x="32" y="120" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Overview</text>
  <text x="268" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172235">Agent operations</text>
  <text x="268" y="87" font-family="Arial, sans-serif" font-size="15" fill="#667085">Thursday, 28 August · Live workspace health</text>
  <rect x="1010" y="34" width="150" height="48" rx="24" fill="#172235"/>
  <text x="1041" y="64" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">+ New run</text>
  <g font-family="Arial, sans-serif">
